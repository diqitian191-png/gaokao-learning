<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1a2032;line-height:1.7;font-size:15px;padding-bottom:70px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:19px;text-align:center;padding:20px 0;background:linear-gradient(135deg,#3b6ef6,#7c4dff);color:#fff;margin:-16px -16px 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid #e6e9f2;border-radius:12px;padding:14px 12px;text-align:left;cursor:pointer;font-family:inherit;font-size:14px;color:#1a2032;border-top:3px solid var(--c)}
.card:active{transform:scale(.97);background:#f7f9ff}
.card b{display:block;font-size:15px;margin-top:2px}
.card small{color:#6b7280;font-size:12px}
.ico{font-size:18px;font-weight:800;color:var(--c)}
.panel{background:#fff;border:1px solid #e6e9f2;border-radius:12px;padding:16px;margin-bottom:12px}
.q{font-size:16px;font-weight:600;margin-bottom:14px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;border:1px solid #e6e9f2;background:#fff;border-radius:10px;padding:13px 14px;font-size:15px;font-family:inherit;margin-bottom:8px;cursor:pointer;color:#1a2032;line-height:1.5}
.opt:active{background:#f7f9ff}
.opt.ok{border-color:#9ee0b4;background:#f0fdf4}
.opt.no{border-color:#f5b5b5;background:#fef2f2}
.exp{margin-top:10px;padding:12px;border-radius:10px;background:#f7f9ff;font-size:14px;border:1px solid #e3e9fa}
.exp.ok{background:#f0fdf4;border-color:#bbf0cc}
.exp.no{background:#fff7f7;border-color:#f8d4d4}
.exp b{display:block;margin-bottom:4px}
.btn{display:inline-block;border:1px solid #e6e9f2;background:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-family:inherit;cursor:pointer;margin:0 8px 8px 0;color:#1a2032;min-height:42px}
.btn:active{background:#f0f4ff}
.btn.p{background:#3b6ef6;color:#fff;border-color:#3b6ef6}
.btn.d{color:#dc2626;border-color:#f5c9c9}
.btn.small{padding:6px 12px;font-size:13px;min-height:34px}
.muted{color:#6b7280;font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--c);color:#fff;margin-right:6px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#eef2fb;color:#5a6b96;margin-right:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e6e9f2;display:flex;z-index:10}
.bar button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;font-family:inherit;color:#6b7280;cursor:pointer}
.bar button.on{color:#3b6ef6}
.loading{text-align:center;padding:20px;color:#6b7280}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid #d9e3fa;border-top-color:#3b6ef6;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.kn-item{padding:10px 0;border-bottom:1px solid #f0f3f9}
.kn-item:last-child{border-bottom:0}
.kn-n{font-weight:600;color:#1a2032;margin-bottom:4px}
.kn-c{color:#374151;font-size:14px}
details.acc summary{list-style:none;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .arrow{transition:transform .2s;display:inline-block}
details.acc[open] summary .arrow{transform:rotate(180deg)}
.demo-box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:12px}
.demo-box h4{color:#3b6ef6;font-size:15px;margin-bottom:8px}
.demo label{display:inline-block;margin-right:12px;font-size:13px;margin-bottom:4px}
.demo input[type=range]{vertical-align:middle;width:110px}
.demo-info{margin-top:8px;font-size:13px;color:#374151;background:#fff;padding:6px 10px;border-radius:6px}
.demo canvas{display:block;margin:8px auto;background:#fff;border-radius:6px;max-width:100%;border:1px solid #e5e7eb}
.demo svg{display:block;margin:8px auto;background:#fff;border-radius:6px;max-width:100%}
</style>

var SUBJ={chinese:{n:'语文',i:'语',c:'#e0565b'},math:{n:'数学',i:'数',c:'#3b6ef6'},english:{n:'英语',i:'英',c:'#7c4dff'},physics:{n:'物理',i:'物',c:'#0ea5e9'},chemistry:{n:'化学',i:'化',c:'#10b981'},biology:{n:'生物',i:'生',c:'#65a30d'},politics:{n:'政治',i:'政',c:'#f59e0b'},history:{n:'历史',i:'史',c:'#b45309'},geography:{n:'地理',i:'地',c:'#0891b2'},japanese:{n:'高考日语',i:'日',c:'#ec4899'}};
var view='home',currentSubj='math',qs=null,demoSubject='math';
function lsGet(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
var tabs=document.querySelectorAll('.bar button');
for(var i=0;i<tabs.length;i++){tabs[i].className=tabs[i].id==='t-'+view?'on':''}
if(view==='home')renderHome();
else if(view==='subject')renderSubject();
else if(view==='quiz')renderQuiz();
else if(view==='wrong')renderWrong();
else if(view==='more')renderMore();

}
function renderHome(){
var html='<div class="grid">';
for(var k in SUBJ){var s=SUBJ[k];var cnt=BANK[k]?BANK[k].length:0;

}

var s=SUBJ[currentSubj];var kn=(typeof KNOWLEDGE!=='undefined'&&KNOWLEDGE[currentSubj])?KNOWLEDGE[currentSubj]:[];
var html='<button class="btn" onclick="go(\'subject\')">返回</button>';
html+='<div class="panel"><h2>'+s.n+' · 知识点</h2><p class="muted">共 '+kn.length+' 个模块，点击展开</p></div>';
if(!kn.length){html+='<div class="panel"><p class="muted">该学科暂无知识点</p></div>';}
else{
for(var i=0;i<kn.length;i++){
var m=kn[i];
html+='<details class="panel acc" style="--c:'+s.c+'"><summary><span style="color:'+s.c+';font-weight:600;font-size:16px">'+esc(m.t)+'</span><span style="color:#9ca3af;font-weight:400;font-size:13px">'+m.items.length+' 条 <span class="arrow">▾</span></span></summary><div style="margin-top:12px">';

var it=m.items[j];

html+='</div>';
}
html+='</div></details>';
}
}
document.getElementById('app').innerHTML=html;
}

for(var k in SUBJ){var sk=SUBJ[k];
html+='<button class="card" style="--c:'+sk.c+';'+(k===demoSubject?'border:2px solid '+sk.c:'')+'" onclick="switchDemo(\''+k+'\')"><span class="ico">'+sk.i+'</span><b>'+sk.n+'</b><small>动态演示</small></button>';

if(typeof MATH_DEMOS!=='undefined'){
for(var key in MATH_DEMOS){
var d=MATH_DEMOS[key];
html+='<div class="demo-box"><h4>🎬 '+d.t+'</h4><div id="demo-container-'+key+'"></div></div>';
}
}else{
html+='<div class="panel"><p class="muted">math-demos.js 未加载</p></div>';
}
html+='</div>';
}

if(demoSubject==='physics'){
html+='<div class="panel"><h3 style="color:#0ea5e9;margin-bottom:12px">物理动态演示</h3>';
html+='<div class="demo-box"><h4>🎬 自由落体</h4><div id="phys-freefall"></div></div>';

html+='<div class="demo-box"><h4>🎬 简谐运动</h4><div id="phys-shm"></div></div>';
html+='</div>';

if(demoSubject==='geography'){
html+='<div class="panel"><h3 style="color:#0891b2;margin-bottom:12px">地理动态演示（视频）</h3>';
html+='<p class="muted" style="margin-bottom:10px">点按钮跳转 B站看动画视频</p>';
html+='<div class="demo-box"><h4>🎬 三圈环流</h4><p class="muted">气压带和风带的形成原理</p><a class="btn small p" href="https://b23.tv/JhRWUxJ" target="_blank" rel="noopener" style="text-decoration:none;margin-top:8px;display:inline-block">去看视频</a></div>';
html+='<div class="demo-box"><h4>🎬 世界表层洋流</h4><p class="muted">全球洋流分布规律</p><a class="btn small p" href="https://b23.tv/SEPNPhd" target="_blank" rel="noopener" style="text-decoration:none;margin-top:8px;display:inline-block">去看视频</a></div>';
html+='<div class="demo-box"><h4>🎬 季风环流</h4><p class="muted">三分钟学会季风环流</p><a class="btn small p" href="https://b23.tv/MZfOtms" target="_blank" rel="noopener" style="text-decoration:none;margin-top:8px;display:inline-block">去看视频</a></div>';
html+='<div class="demo-box"><h4>🎬 锋面气旋</h4><p class="muted">地理小课堂：锋面气旋</p><a class="btn small p" href="https://b23.tv/NNGGojM" target="_blank" rel="noopener" style="text-decoration:none;margin-top:8px;display:inline-block">去看视频</a></div>';
html+='<div class="demo-box"><h4>🎬 昼夜长短变化（16合集）</h4><p class="muted">太阳直射点、昼夜变化、地球运动、岩石圈等动画</p><a class="btn small p" href="https://b23.tv/nOMXqKp" target="_blank" rel="noopener" style="text-decoration:none;margin-top:8px;display:inline-block">去看视频</a></div>';
html+='</div>';
}

document.getElementById('app').innerHTML=html;

if(demoSubject==='math'&&typeof MATH_DEMOS!=='undefined'){
setTimeout(function(){
var keys=Object.keys(MATH_DEMOS);
keys.forEach(function(k){
var c=document.getElementById('demo-container-'+k);
if(c)c.innerHTML=MATH_DEMOS[k].html;
});
setTimeout(function(){
keys.forEach(function(k){
try{if(typeof initMathDemo==='function')initMathDemo(k);}
catch(e){console.error('演示出错:',k,e);}
});
},120);
},50);
}

if(demoSubject==='physics'&&typeof renderPhysicsDemo==='function'){
setTimeout(function(){
renderPhysicsDemo('phys-freefall','freefall');
renderPhysicsDemo('phys-projectile','projectile');
renderPhysicsDemo('phys-shm','shm');
},120);
}
}
function switchDemo(k){demoSubject=k;renderDemo();}
function startQuiz(){
var bank=BANK[currentSubj]||[];
if(!bank.length){alert('该学科暂无题目');return}
var list=shuf(bank).slice(0,5);
qs={subj:currentSubj,list:list,idx:0,pick:null,correct:0,fin:false};
view='quiz';render();
}
function renderQuiz(){
if(!qs){document.getElementById('app').innerHTML='<div class="panel">请先选学科</div>';return}
var s=SUBJ[qs.subj];
if(qs.fin){
var r=Math.round(qs.correct/qs.list.length*100);
document.getElementById('app').innerHTML='<div class="panel"><h2>结果</h2><p style="font-size:28px;color:#3b6ef6;font-weight:800">'+qs.correct+' / '+qs.list.length+'</p><p class="muted">正确率 '+r+'%</p><button class="btn p" onclick="startQuiz()">再来一组</button><button class="btn" onclick="go(\'home\')">返回首页</button><button class="btn" onclick="go(\'wrong\')">查看错题</button></div>';
return;
}
var q=qs.list[qs.idx];var picked=qs.pick;
var html='<div class="panel"><p class="muted">'+s.n+' · 第 '+(qs.idx+1)+'/'+qs.list.length+' 题</p>';
html+='<div class="q">'+esc(q.q)+'</div>';
for(var i=0;i<q.o.length;i++){
var cls='opt';
if(picked!==null){if(i===q.a)cls+=' ok';else if(i===picked)cls+=' no'}
html+='<button class="'+cls+'"'+(picked!==null?' disabled':'')+' onclick="pickAns('+i+')">'+'ABCD'[i]+'. '+esc(q.o[i])+'</button>';
}
if(picked!==null){
var okFlag=picked===q.a;
html+='<div class="exp '+(okFlag?'ok':'no')+'"><b>'+(okFlag?'正确':'错误，正确答案 '+'ABCD'[q.a])+'</b><p>'+esc(q.e)+'</p></div>';
html+='<button class="btn p" onclick="nextQ()">'+(qs.idx+1<qs.list.length?'下一题':'查看结果')+'</button>';
}
html+='</div>';
document.getElementById('app').innerHTML=html;
}
function pickAns(i){
if(qs.pick!==null)return;
qs.pick=i;
var q=qs.list[qs.idx];
if(i===q.a)qs.correct++;
else{var wb=lsGet('hs_wrong',[]);wb.unshift({subj:qs.subj,q:q.q,o:q.o,a:q.a,e:q.e,pick:i,t:Date.now()});lsSet('hs_wrong',wb)}
renderQuiz();
}
function nextQ(){if(qs.idx+1<qs.list.length){qs.idx++;qs.pick=null;renderQuiz()}else{qs.fin=true;renderQuiz()}}
function renderWrong(){
var wb=lsGet('hs_wrong',[]);
if(!wb.length){document.getElementById('app').innerHTML='<div class="panel"><p>错题本为空。</p></div>';return}
var html='<div class="panel"><h2>错题本（'+wb.length+'）</h2>';
html+='<button class="btn p" onclick="doAI()">AI 分析</button>';
html+='<button class="btn" onclick="retryWrong()">错题重练</button>';
html+='<button class="btn d" onclick="clearWrong()">清空</button>';
html+='<div id="aiResult"></div></div>';
for(var i=0;i<wb.length;i++){
var x=wb[i];var s=SUBJ[x.subj]||{n:'未知',c:'#888'};
html+='<div class="panel" style="border-left:4px solid '+s.c+'"><p class="muted"><span class="pill" style="--c:'+s.c+'">'+s.n+'</span></p>';
html+='<div class="q">'+esc(x.q)+'</div>';
html+='<p>你的答案：<b style="color:#dc2626">'+'ABCD'[x.pick]+'. '+esc(x.o[x.pick])+'</b></p>';
html+='<p>正确答案：<b style="color:#16a34a">'+'ABCD'[x.a]+'. '+esc(x.o[x.a])+'</b></p>';
if(x.point)html+='<span class="tag">知识点：'+esc(x.point)+'</span>';
if(x.reason)html+='<span class="tag">错因：'+esc(x.reason)+'</span>';
html+='<div class="exp">'+esc(x.e)+'</div>';
if(x.similar&&x.similar.q)html+='<div class="exp" style="background:#fffdf5;border-color:#f3e3b6"><b>同类变式</b><p>'+esc(x.similar.q)+'</p></div>';
html+='<button class="btn d" onclick="delWrong('+i+')">删除</button></div>';
}
document.getElementById('app').innerHTML=html;
}
function delWrong(i){var wb=lsGet('hs_wrong',[]);wb.splice(i,1);lsSet('hs_wrong',wb);renderWrong()}
function clearWrong(){if(!confirm('清空错题本？'))return;lsSet('hs_wrong',[]);renderWrong()}
function retryWrong(){var wb=lsGet('hs_wrong',[]);if(!wb.length){alert('错题本为空');return}var picked=shuf(wb).slice(0,5);var list=picked.map(function(x){return{q:x.q,o:x.o,a:x.a,e:x.e}});qs={subj:picked[0].subj,list:list,idx:0,pick:null,correct:0,fin:false};view='quiz';render()}
async function callAI(messages){
if(!WORKER_URL||WORKER_URL.indexOf('你的')>=0)throw new Error('Worker 未配置');
var res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages})});
if(!res.ok)throw new Error('服务器错误 '+res.status);
var data=await res.json();
if(data.error)throw new Error(data.error);
if(!data.choices||!data.choices[0])throw new Error('AI 返回异常');
return data.choices[0].message.content||'';
}
function extractJSON(text){
if(!text)return null;
var m=text.match(/```(?:json)?\s*([\s\S]*?)```/);
if(m)text=m[1];
var s=text.indexOf('['),e=text.lastIndexOf(']');
if(s>=0&&e>s){try{return JSON.parse(text.slice(s,e+1))}catch(err){}}
var s2=text.indexOf('{'),e2=text.lastIndexOf('}');
if(s2>=0&&e2>s2){try{return [JSON.parse(text.slice(s2,e2+1))]}catch(err){}}
return null;
}
async function doAI(){
var wb=lsGet('hs_wrong',[]);
if(!wb.length){alert('错题本为空');return}
var box=document.getElementById('aiResult');
if(box)box.innerHTML='<div class="loading"><span class="spinner"></span>AI 分析中…</div>';
var batches=[];for(var i=0;i<wb.length;i+=8)batches.push(wb.slice(i,i+8));
var sys='你是高中全科老师。为每道错题补充字段返回JSON数组：[{id:原题q,point:知识点10字内,d:1或2或3,reason:错因15字内,e:详细解析80字内,similar:{q:变式题,o:[A,B,C,D],a:0,e:解析}}]。只返回JSON数组。';
var all=[];
try{
for(var b=0;b<batches.length;b++){
if(box)box.innerHTML='<div class="loading"><span class="spinner"></span>分析第 '+(b+1)+' / '+batches.length+' 批…</div>';
var batch=batches[b].map(function(x){return{q:x.q,o:x.o,a:x.a,chosen:x.pick}});
var content=await callAI([{role:'system',content:sys},{role:'user',content:JSON.stringify(batch)}]);
var parsed=extractJSON(content);
if(parsed&&Array.isArray(parsed))all=all.concat(parsed);
if(b<batches.length-1)await new Promise(function(r){setTimeout(r,600)});
}
var map={};wb.forEach(function(x){map[x.q]=x});
var updated=0;
all.forEach(function(a){
var key=a.id||a.q;if(!key)return;
var x=map[key];
if(!x){var k2=key.replace(/\s+/g,'');for(var i=0;i<wb.length;i++){if(wb[i].q.replace(/\s+/g,'')===k2){x=wb[i];break}}}
if(!x)return;
if(a.point)x.point=String(a.point).slice(0,30);
if(a.d)x.d=a.d;
if(a.reason)x.reason=String(a.reason).slice(0,40);
if(a.e)x.e=String(a.e).slice(0,300);
if(a.similar&&a.similar.q)x.similar=a.similar;
updated++;
});
lsSet('hs_wrong',wb);
if(box)box.innerHTML='<div class="exp ok">已更新 '+updated+' / '+wb.length+' 条</div>';
setTimeout(renderWrong,800);
}catch(e){if(box)box.innerHTML='<div class="exp no">'+(e.message||'分析失败')+'</div>'}
}
function renderMore(){
var html='<div class="panel"><h2>知识点手册</h2><p class="muted">点击学科查看</p></div><div class="grid">';
for(var k in SUBJ){var s=SUBJ[k];
html+='<button class="card" style="--c:'+s.c+'" onclick="showKnowledge(\''+k+'\')"><span class="ico">'+s.i+'</span><b>'+s.n+'</b><small>知识点手册</small></button>';
}
html+='</div>';
document.getElementById('app').innerHTML=html;
}
go('home');
</script>
</body>
</html>
