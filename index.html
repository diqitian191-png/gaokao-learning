<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b6ef6">
<title>高中全科学习助手 + 高考日语</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1a2032;--muted:#6b7280;--border:#e6e9f2;--brand:#3b6ef6;--ok:#16a34a;--bad:#dc2626;--radius:14px;--shadow:0 8px 24px rgba(30,50,120,.08);--tabh:58px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header.hero{background:linear-gradient(135deg,#3b6ef6,#7c4dff);color:#fff;padding:20px 0 18px;text-align:center}
header.hero h1{font-size:19px;font-weight:700}
header.hero h1 span{opacity:.85;font-weight:500;font-size:15px}
header.hero p{opacity:.9;font-size:12px;margin-top:4px}
main{padding:16px 0 20px}
.block{margin-bottom:20px}
h2.h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
h2.h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--brand)}
h3.h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
h3.h2::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--brand)}
.tip{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.muted{color:var(--muted);font-size:13px}
.link{color:var(--brand);cursor:pointer;text-decoration:underline}
.today-banner{background:linear-gradient(135deg,#eaf1ff,#f3ebff);border:1px solid #d9e3fa;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.today-banner b{color:var(--brand);font-size:22px;font-weight:800;line-height:1}
.today-banner .lbl{font-size:13px;color:#4b5563}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:left;cursor:pointer;font-family:inherit;font-size:14px;color:var(--text);transition:.16s;display:flex;flex-direction:column;gap:2px;min-height:70px}
.card:active{transform:scale(.97);background:#f7f9ff}
.subj{border-top:3px solid var(--c)}
.subj .ico{font-size:18px;font-weight:800;color:var(--c);line-height:1.1}
.subj b{font-size:14.5px;margin-top:2px}
.subj small{color:var(--muted);font-size:11.5px}
.feat b{font-size:14.5px}
.feat small{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.45}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer;font-family:inherit;transition:.16s;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.btn:active{background:#f0f4ff;transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:active{background:#2f5fe0}
.btn.danger{color:var(--bad);border-color:#f5c9c9}
.btn.small{padding:8px 12px;font-size:13.5px;min-height:38px}
.btn.wide{width:100%;margin-top:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;font-family:inherit;padding:4px 0;margin-bottom:10px}
.back:active{color:var(--brand)}
.subj-head{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-left:5px solid var(--c);border-radius:var(--radius);padding:14px;margin-bottom:16px;flex-wrap:wrap}
.subj-head .ico{width:42px;height:42px;flex:0 0 42px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:#fff;font-size:18px;font-weight:800}
.subj-head h2{font-size:16px}
.subj-head p{font-size:12px;color:var(--muted)}
.subj-head .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;width:100%}
.subj-head .acts .btn{flex:1;min-width:100px}
details.acc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
details.acc summary{cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:32px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"＋";color:var(--muted);font-weight:400;font-size:16px}
details.acc[open] summary::after{content:"－"}
details.acc ul{margin:8px 0 2px;padding-left:18px}
details.acc li{font-size:13.5px;color:#374151;margin:4px 0}
ul.tips{list-style:none}
ul.tips li{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
ul.tips li::before{content:"💡 "}
.diff-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.diff-row .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12.5px;background:var(--c);color:#fff}
.progress{height:6px;background:#e8ecf6;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress.thin{height:4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#3b6ef6,#7c4dff);border-radius:999px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.qtext{font-size:16px;font-weight:600;line-height:1.65;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;border:1px solid var(--border);background:#fff;border-radius:11px;padding:13px 14px;font-size:15px;font-family:inherit;color:var(--text);cursor:pointer;transition:.14s;line-height:1.55;min-height:48px}
.opt:active:not(:disabled){background:#f7f9ff;transform:scale(.99)}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 24px;height:24px;border-radius:6px;background:#eef2fb;color:#5a6b96;display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.opt.right{border-color:#9ee0b4;background:#f0fdf4}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:#f5b5b5;background:#fef2f2}
.opt.wrong .k{background:var(--bad);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-radius:11px;background:#f7f9ff;border:1px solid #e3e9fa;font-size:14px}
.explain.ok{background:#f0fdf4;border-color:#bbf0cc}
.explain.no{background:#fff7f7;border-color:#f8d4d4}
.explain b{display:block;margin-bottom:5px;font-size:13.5px}
.explain p{color:#374151}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.result{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:16px}
.result .score{font-size:34px;font-weight:800;color:var(--brand);line-height:1.3}
.wcard{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--c);border-radius:12px;padding:14px;margin-bottom:10px}
.whead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.wans{font-size:13.5px;margin-top:8px;line-height:1.7}
.wmeta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:#eef2fb;color:#5a6b96}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--brand);font-weight:800}
.stat span{font-size:12px;color:var(--muted)}
.logrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:13.5px}
.logrow .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.logrow time{margin-left:auto;color:var(--muted);font-size:12.5px}
.kana{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;overflow-x:auto}
.kana-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.kana-row:last-child{margin-bottom:0}
.kana-cell{background:#f7f9ff;border-radius:9px;padding:6px 3px;text-align:center;display:flex;flex-direction:column;line-height:1.3}
.kana-cell.empty{background:transparent}
.kana-cell .k{font-size:17px;font-weight:700;color:#1a2032}
.kana-cell .k2{font-size:12.5px;color:#7c4dff;font-weight:600}
.kana-cell .r{font-size:10.5px;color:var(--muted)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);height:calc(var(--tabh) + env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;padding:6px 0;transition:.16s;position:relative}
.tabbar button:active{background:#f5f7fb}
.tabbar button.active{color:var(--brand)}
.tabbar button .ti{font-size:20px;line-height:1}
.tabbar .badge{position:absolute;top:4px;right:50%;margin-right:-22px;background:#dc2626;color:#fff;border-radius:999px;font-size:10px;line-height:15px;min-width:15px;padding:0 4px;display:none}
.tabbar .badge.show{display:inline-block}
.ai-loading{background:linear-gradient(135deg,#eaf1ff,#f3ebff);border:1px solid #d9e3fa;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.spinner{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:3px solid #d9e3fa;border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-progress{font-size:13.5px;color:#4b5563}
.ai-progress b{color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 20px);transform:translateX(-50%);background:rgba(26,32,50,.94);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:80vw;text-align:center}
.toast.show{opacity:1}
@media print{header.hero,.tabbar,.back,.btn,.tip,.diff-row,.today-banner{display:none!important}body{background:#fff;padding-bottom:0}.wcard,.qcard{page-break-inside:avoid;border-color:#ccc}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>高中全科 <span>+ 高考日语</span></h1>

<main><div class="wrap" id="app"></div></main>

</nav>
